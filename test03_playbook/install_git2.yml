# test03_playbook/install_git.yml

- name: Git 설치 및 사용자 환경 설정
  hosts : all
  become: yes

  # 변수를 정의하고 값을 미리 담아 놓을 수 있다.
  vars:
    user_name: "cdasdsad"
    user_email: "wlsgur0103@gmail.com"

  tasks:
    - name: 1. Git 패키지 설치
      package:
        name: git
        state: present
      
    - name: 2. user.name 설정
      git_config:
        name: user.name
        value: {{ user_name }}
        scope: global
      become: yes
      become_user: user1

    - name: 3. user.email 설정
      git_config:
        name: user.email
        value: {{ user_email }}
        scope: global
      become: yes
      become_user: user1